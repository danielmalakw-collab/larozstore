<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر عسل النحل</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root { --honey: #c98312; --deep: #7f4b09; --cream: #fff8e9; --paper: #fffdf8; --ink: #2b2116; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Noto Sans Arabic", sans-serif; color: var(--ink); background: var(--cream); }
    .app-shell { width: 100%; min-height: 100vh; overflow-x: hidden; background-color: var(--cream); background-image: radial-gradient(circle at 1px 1px, rgba(201,131,18,.1) 1px, transparent 0); background-size: 18px 18px; }
    .focus-ring:focus-visible { outline: 3px solid rgba(201,131,18,.45); outline-offset: 3px; }
    #cartDrawer, #cartBackdrop, .modal-layer { visibility: hidden; opacity: 0; pointer-events: none; }
    #cartDrawer { transform: translateX(105%); transition: transform .32s ease, opacity .2s ease; }
    #cartDrawer.open { visibility: visible; opacity: 1; pointer-events: auto; transform: translateX(0); }
    #cartBackdrop.open, .modal-layer.open { visibility: visible; opacity: 1; pointer-events: auto; transition: opacity .2s ease; }
    .modal-box { transform: translateY(16px) scale(.98); transition: transform .2s ease; }
    .modal-layer.open .modal-box { transform: translateY(0) scale(1); }
    .product-card { transition: transform .2s ease, box-shadow .2s ease; }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 20px 34px rgba(89,54,10,.14); }
    .banner-slide { display: none; }
    .banner-slide.active { display: grid; animation: fade .45s ease; }
    @keyframes fade { from { opacity: .25; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    .toast { transform: translateY(20px); opacity: 0; pointer-events: none; transition: .25s; }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- الهيدر -->
    <header class="sticky top-0 z-30 border-b border-[#ead9b8] bg-[#fffdf8]/95 backdrop-blur">
      <div class="mx-auto flex w-full max-w-6xl items-center justify-between gap-3 px-5 py-4 sm:px-8">
        <a href="#" class="flex items-center gap-3 no-underline text-inherit">
          <div id="logoHolder" class="flex h-11 w-11 items-center justify-center overflow-hidden rounded-full bg-[#c98312] text-white shadow-sm">
            <i data-lucide="hexagon" width="24"></i>
          </div>
          <div>
            <p class="m-0 text-xs font-bold text-[#9a610c]">من خلية النحل إلى مائدتك</p>
            <h1 id="storeNameDisplay" class="m-0 font-extrabold text-[#2b2116] text-2xl sm:text-3xl">متجر عسل النحل</h1>
          </div>
        </a>
        <button id="cartButton" type="button" class="focus-ring relative inline-flex items-center gap-2 rounded-full border border-[#d8ad61] bg-[#fff8e9] px-4 py-2.5 font-bold text-[#7f4b09] hover:bg-[#f8e7c4]">
          <i data-lucide="shopping-bag" width="20"></i>
          <span>السلة</span>
          <span id="cartCount" class="min-w-5 rounded-full bg-[#c98312] px-1.5 py-0.5 text-center text-xs text-white">0</span>
        </button>
      </div>
    </header>

    <main>
      <!-- البانر -->
      <section class="mx-auto w-full max-w-6xl px-5 pt-8 sm:px-8">
        <div id="bannerArea" class="relative overflow-hidden rounded-[2rem] border-4 border-[#fffdf8] bg-[#7f4b09] shadow-xl min-h-[220px]"></div>
        <div class="mt-3 flex items-center justify-center gap-2">
          <button id="bannerPrev" class="focus-ring rounded-full bg-[#f4e4c3] p-2 text-[#7f4b09]" type="button"><i data-lucide="chevron-right" width="18"></i></button>
          <div id="bannerDots" class="flex gap-2"></div>
          <button id="bannerNext" class="focus-ring rounded-full bg-[#f4e4c3] p-2 text-[#7f4b09]" type="button"><i data-lucide="chevron-left" width="18"></i></button>
        </div>
      </section>

      <!-- المنتجات -->
      <section class="mx-auto w-full max-w-6xl px-5 py-12 sm:px-8">
        <div class="mb-6 flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between">
          <div>
            <p class="mb-1 text-sm font-bold text-[#9a610c]">اختياراتنا المميزة</p>
            <h2 class="m-0 font-extrabold text-[#2b2116] text-2xl">عسل يناسب كل ذوق</h2>
          </div>
          <label class="relative block w-full lg:w-80">
            <i data-lucide="search" class="absolute right-4 top-3 text-[#9a610c]" width="19"></i>
            <input id="searchInput" type="search" class="focus-ring w-full rounded-xl border border-[#dcc49c] bg-[#fffdf8] py-3 pr-11 pl-4 text-sm outline-none" placeholder="ابحث عن عسل أو منتج">
          </label>
        </div>

        <!-- الأقسام -->
        <nav id="categoryFilters" class="mb-7 flex flex-wrap gap-2"></nav>

        <!-- شبكة المنتجات -->
        <div id="productsGrid" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
        <p id="noProducts" class="hidden py-14 text-center font-bold text-[#806e55]">لا توجد منتجات مطابقة لبحثك.</p>
      </section>
    </main>

    <footer class="border-t border-[#ead9b8] bg-[#f4e4c3] px-5 py-7 text-center">
      <p class="m-0 text-sm text-[#72572d]">عسل طبيعي مختار بعناية لأجمل لحظاتك اليومية.</p>
    </footer>
  </div>

  <!-- سلة التسوق -->
  <div id="cartBackdrop" class="fixed inset-0 z-40 bg-[#2b2116]/45"></div>
  <aside id="cartDrawer" class="fixed inset-y-0 right-0 z-50 flex w-full max-w-md flex-col border-l border-[#ead9b8] bg-[#fffdf8] shadow-2xl">
    <div class="flex items-center justify-between border-b border-[#ead9b8] bg-[#fff8e9] px-5 py-5">
      <h2 class="m-0 font-extrabold text-[#2b2116] text-xl">سلة التسوق</h2>
      <button type="button" class="close-cart focus-ring rounded-full p-2 text-[#7f4b09]"><i data-lucide="x"></i></button>
    </div>
    <div id="cartItems" class="flex-1 overflow-y-auto px-5 py-3">
      <div id="emptyCart" class="py-16 text-center">
        <i data-lucide="shopping-basket" class="mx-auto mb-4 text-[#b3700b]" width="42"></i>
        <p class="mb-2 font-bold text-[#3d2d1a]">سلتك فارغة حالياً</p>
        <p class="m-0 text-sm text-[#806e55]">اختر منتجاتك المفضلة وسنحتفظ بها هنا.</p>
      </div>
    </div>
    <div class="border-t border-[#ead9b8] bg-[#fff8e9] p-5">
      <div class="mb-4 flex justify-between">
        <span class="font-bold text-[#59462c]">الإجمالي</span>
        <output id="cartTotal" class="font-extrabold text-[#9a610c]">0 ج.م</output>
      </div>
      <button id="checkoutOpen" type="button" class="focus-ring w-full rounded-xl bg-[#c98312] px-4 py-3 font-bold text-white">إتمام الطلب</button>
    </div>
  </aside>

  <!-- تفاصيل المنتج -->
  <div id="productModal" class="modal-layer fixed inset-0 z-[60] flex items-center justify-center bg-[#2b2116]/55 p-4">
    <section class="modal-box w-full max-w-lg rounded-3xl bg-[#fffdf8] p-6 shadow-2xl">
      <div class="mb-4 flex justify-between">
        <h2 id="productModalTitle" class="m-0 font-extrabold text-xl"></h2>
        <button class="close-product focus-ring rounded-full p-1"><i data-lucide="x"></i></button>
      </div>
      <img id="productModalImage" class="h-56 w-full rounded-2xl object-cover" alt="">
      <p id="productModalDescription" class="my-4 leading-8 text-[#695944]"></p>
      <div class="flex items-center justify-between">
        <strong id="productModalPrice" class="text-xl text-[#9a610c]"></strong>
        <button id="modalAddProduct" class="focus-ring rounded-xl bg-[#c98312] px-5 py-2.5 font-bold text-white" type="button">أضف للسلة</button>
      </div>
    </section>
  </div>

  <!-- شاشة الشراء وإرسال الطلب -->
  <div id="checkoutModal" class="modal-layer fixed inset-0 z-[60] overflow-y-auto bg-[#2b2116]/55 p-4">
    <section class="modal-box mx-auto my-6 w-full max-w-xl rounded-3xl bg-[#fffdf8] p-6 shadow-2xl">
      <div class="mb-5 flex items-center justify-between">
        <h2 class="m-0 font-extrabold text-xl">بيانات التوصيل</h2>
        <button class="close-checkout focus-ring rounded-full p-1"><i data-lucide="x"></i></button>
      </div>
      <form id="checkoutForm" class="grid gap-4 sm:grid-cols-2">
        <div><label for="customerName" class="text-sm font-bold">الاسم الكامل</label><input id="customerName" required class="mt-1 w-full rounded-xl border border-[#dcc49c] p-3"></div>
        <div><label for="customerPhone" class="text-sm font-bold">رقم الهاتف</label><input id="customerPhone" required inputmode="tel" class="mt-1 w-full rounded-xl border border-[#dcc49c] p-3"></div>
        <div><label for="customerAltPhone" class="text-sm font-bold">رقم بديل</label><input id="customerAltPhone" inputmode="tel" class="mt-1 w-full rounded-xl border border-[#dcc49c] p-3"></div>
        <div><label for="customerCity" class="text-sm font-bold">المدينة</label><input id="customerCity" required class="mt-1 w-full rounded-xl border border-[#dcc49c] p-3"></div>
        <div class="sm:col-span-2"><label for="customerAddress" class="text-sm font-bold">العنوان بالتفصيل</label><textarea id="customerAddress" required rows="2" class="mt-1 w-full rounded-xl border border-[#dcc49c] p-3"></textarea></div>
        <div class="sm:col-span-2"><label for="customerNotes" class="text-sm font-bold">ملاحظات الطلب</label><textarea id="customerNotes" rows="2" class="mt-1 w-full rounded-xl border border-[#dcc49c] p-3"></textarea></div>
        <button id="submitOrder" type="submit" class="sm:col-span-2 rounded-xl bg-[#c98312] px-4 py-3 font-bold text-white">إرسال الطلب عبر WhatsApp</button>
      </form>
    </section>
  </div>

  <div id="toast" class="toast fixed bottom-5 left-5 z-[100] rounded-xl bg-[#2b2116] px-4 py-3 text-sm font-bold text-white"></div>

  <script>
    (() => {
      // 🔴 قم باستبدال هذه البيانات ببيانات مشروعك من Supabase
      const SUPABASE_URL = "YOUR_SUPABASE_URL";
      const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
      
      const supabase = (SUPABASE_URL !== "YOUR_SUPABASE_URL") 
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
        : null;

      let store = {
        storeName: "متجر عسل النحل",
        whatsapp: "201000000000",
        categories: [{ id: "all", name: "الكل" }],
        banners: [],
        products: []
      };

      let cart = new Map(), currentBanner = 0, selectedProduct = null;
      const $ = id => document.getElementById(id);
      const money = n => new Intl.NumberFormat("ar-EG").format(Number(n)) + " ج.م";
      const safe = s => String(s || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m]));

      function toast(msg) {
        const el = $("toast"); el.textContent = msg; el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 3000);
      }

      // جلب البيانات من Supabase
      async function fetchStoreData() {
        if (!supabase) {
          console.warn("لم يتم ضبط بيانات Supabase بعد.");
          return;
        }

        try {
          // 1. جلب الأقسام
          const { data: categories } = await supabase.from('categories').select('*');
          if (categories && categories.length) {
            store.categories = [{ id: "all", name: "الكل" }, ...categories];
          }

          // 2. جلب البانرات
          const { data: banners } = await supabase.from('banners').select('*').eq('active', true);
          if (banners) store.banners = banners;

          // 3. جلب المنتجات
          const { data: products } = await supabase.from('products').select('*').eq('visible', true);
          if (products) store.products = products;

          renderBanners();
          renderFilters();
          renderProducts();
        } catch (err) {
          console.error("خطأ في جلب البيانات:", err);
        }
      }

      function renderBanners() {
        if (!store.banners.length) { $("bannerArea").innerHTML = ""; return; }
        currentBanner %= store.banners.length;
        $("bannerArea").innerHTML = store.banners.map((b, i) => `
          <article class="banner-slide min-h-[260px] grid-cols-1 bg-[#7f4b09] md:grid-cols-2 ${i === currentBanner ? "active" : ""}">
            <div class="flex flex-col justify-center p-7 text-white sm:p-10">
              <h2 class="m-0 text-3xl font-extrabold leading-relaxed">${safe(b.title)}</h2>
              <p class="mt-3 max-w-md leading-8 text-[#fff4dc]">${safe(b.text)}</p>
            </div>
            ${b.image ? `<img src="${safe(b.image)}" class="h-56 w-full object-cover md:h-full" alt="">` : ''}
          </article>
        `).join("");
        
        $("bannerDots").innerHTML = store.banners.map((_, i) => `
          <button class="h-2.5 w-2.5 rounded-full ${i === currentBanner ? "bg-[#c98312]" : "bg-[#dfc595]"}" data-dot="${i}"></button>
        `).join("");

        document.querySelectorAll("[data-dot]").forEach(b => b.onclick = () => { currentBanner = +b.dataset.dot; renderBanners(); });
      }

      function renderFilters() {
        const host = $("categoryFilters");
        host.innerHTML = store.categories.map(c => `
          <button class="filter-btn focus-ring rounded-full border border-[#d8ad61] px-4 py-2 text-sm font-bold ${c.id === (host.dataset.active || "all") ? "bg-[#c98312] text-white" : "bg-[#fffdf8] text-[#7f4b09]"}" data-category="${safe(c.id)}">
            ${safe(c.name)}
          </button>
        `).join("");
        host.querySelectorAll("button").forEach(b => b.onclick = () => { host.dataset.active = b.dataset.category; renderFilters(); renderProducts(); });
      }

      function renderProducts() {
        const search = $("searchInput").value.trim().toLowerCase();
        const cat = $("categoryFilters").dataset.active || "all";
        const list = store.products.filter(p => (cat === "all" || p.category_id === cat) && (`${p.name} ${p.description}`.toLowerCase().includes(search)));
        
        $("noProducts").classList.toggle("hidden", !!list.length);
        $("productsGrid").innerHTML = list.map(p => `
          <article class="product-card overflow-hidden rounded-3xl border border-[#ead9b8] bg-[#fffdf8] p-4 shadow-sm">
            <img src="${safe(p.image)}" class="h-48 w-full rounded-2xl object-cover" alt="${safe(p.name)}">
            <div class="pt-4">
              <h3 class="m-0 font-bold text-[#2b2116]">${safe(p.name)}</h3>
              <p class="mt-2 min-h-12 text-sm leading-6 text-[#74634d]">${safe(p.description)}</p>
              <div class="mt-4 flex items-center justify-between gap-2">
                <strong class="text-[#9a610c]">${money(p.price)}</strong>
                <div class="flex gap-2">
                  <button class="details-product rounded-xl border border-[#d8ad61] p-2 text-[#7f4b09]" data-id="${p.id}"><i data-lucide="eye" width="18"></i></button>
                  <button class="add-product rounded-xl bg-[#c98312] px-3 py-2 text-sm font-bold text-white" data-id="${p.id}">أضف للسلة</button>
                </div>
              </div>
            </div>
          </article>
        `).join("");

        document.querySelectorAll(".add-product").forEach(b => b.onclick = () => addToCart(b.dataset.id));
        document.querySelectorAll(".details-product").forEach(b => b.onclick = () => openProduct(b.dataset.id));
        if (window.lucide) lucide.createIcons();
      }

      function openProduct(id) {
        selectedProduct = store.products.find(p => String(p.id) === String(id));
        if (!selectedProduct) return;
        $("productModalTitle").textContent = selectedProduct.name;
        $("productModalDescription").textContent = selectedProduct.description;
        $("productModalPrice").textContent = money(selectedProduct.price);
        $("productModalImage").src = selectedProduct.image;
        openModal("productModal");
      }

      function setCartOpen(open) {
        $("cartDrawer").classList.toggle("open", open);
        $("cartBackdrop").classList.toggle("open", open);
      }

      function addToCart(id) {
        const p = store.products.find(x => String(x.id) === String(id));
        if (!p) return;
        const x = cart.get(id) || { ...p, quantity: 0 };
        x.quantity++;
        cart.set(id, x);
        renderCart();
        toast("تمت إضافة المنتج إلى السلة");
      }

      function renderCart() {
        let qty = 0, total = 0;
        $("cartItems").querySelectorAll(".cart-row").forEach(x => x.remove());
        cart.forEach((p, id) => {
          qty += p.quantity;
          total += p.price * p.quantity;
          const el = document.createElement("article");
          el.className = "cart-row flex items-center gap-3 border-b border-[#f0e4cd] py-4";
          el.innerHTML = `
            <img src="${safe(p.image)}" class="h-12 w-12 rounded-xl object-cover" alt="">
            <div class="min-w-0 flex-1">
              <h3 class="m-0 truncate font-bold text-sm">${safe(p.name)}</h3>
              <p class="m-0 text-xs font-bold text-[#9a610c]">${money(p.price)}</p>
            </div>
            <div class="flex items-center gap-2">
              <button class="minus rounded-lg border border-[#dcc49c] p-1"><i data-lucide="minus" width="14"></i></button>
              <b class="text-sm">${p.quantity}</b>
              <button class="plus rounded-lg border border-[#dcc49c] p-1"><i data-lucide="plus" width="14"></i></button>
            </div>`;
          el.querySelector(".minus").onclick = () => changeQty(id, -1);
          el.querySelector(".plus").onclick = () => changeQty(id, 1);
          $("cartItems").appendChild(el);
        });
        $("emptyCart").hidden = qty > 0;
        $("cartCount").textContent = qty;
        $("cartTotal").textContent = money(total);
        if (window.lucide) lucide.createIcons();
      }

      function changeQty(id, n) {
        const p = cart.get(id);
        if (!p) return;
        p.quantity += n;
        if (p.quantity < 1) cart.delete(id);
        renderCart();
      }

      function openModal(id) { $(id).classList.add("open"); }
      function closeModal(id) { $(id).classList.remove("open"); }

      // أحداث الزرار والإنبوت
      $("cartButton").onclick = () => setCartOpen(!$("cartDrawer").classList.contains("open"));
      document.querySelectorAll(".close-cart").forEach(b => b.onclick = () => setCartOpen(false));
      $("cartBackdrop").onclick = () => setCartOpen(false);
      $("searchInput").oninput = renderProducts;
      $("bannerPrev").onclick = () => { currentBanner--; if (currentBanner < 0) currentBanner = store.banners.length - 1; renderBanners(); };
      $("bannerNext").onclick = () => { currentBanner++; renderBanners(); };
      document.querySelector(".close-product").onclick = () => closeModal("productModal");
      $("modalAddProduct").onclick = () => { if (selectedProduct) addToCart(selectedProduct.id); closeModal("productModal"); };
      $("checkoutOpen").onclick = () => { if (!cart.size) { toast("سلتك فارغة حالياً"); return; } setCartOpen(false); openModal("checkoutModal"); };
      document.querySelector(".close-checkout").onclick = () => closeModal("checkoutModal");

      // إرسال الطلب للواتساب وحفظ الطلب في Supabase
      $("checkoutForm").onsubmit = async e => {
        e.preventDefault();
        const orderStr = [...cart.values()].map(p => `${p.name} × ${p.quantity}`).join("، ");
        const total = [...cart.values()].reduce((s, p) => s + p.price * p.quantity, 0);

        const customer = {
          name: $("customerName").value,
          phone: $("customerPhone").value,
          city: $("customerCity").value,
          address: $("customerAddress").value,
          notes: $("customerNotes").value,
          order_details: orderStr,
          total: total
        };

        // حفظ الطلب في Supabase لو جدول الأوردرات موجود
        if (supabase) {
          await supabase.from('orders').insert([customer]);
        }

        const msg = `مرحباً، أود تأكيد طلبي من ${store.storeName}:\nالاسم: ${customer.name}\nالهاتف: ${customer.phone}\nالعنوان: ${customer.city} - ${customer.address}\nالطلب: ${orderStr}\nالإجمالي: ${money(total)}`;
        window.open(`https://wa.me/${store.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");

        cart.clear();
        renderCart();
        closeModal("checkoutModal");
        $("checkoutForm").reset();
        toast("تم إرسال طلبك بنجاح");
      };

      fetchStoreData();
      if (window.lucide) lucide.createIcons();
    })();
  </script>
</body>
</html>
